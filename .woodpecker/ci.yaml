# The asteroids bench is a wasm client plus a native authoritative server, so the gate builds both:
# `cargo test` covers the server and shared logic, and ./build.sh is the real check that the client
# still compiles for wasm32, that the JS glue matches the crate, and that the server binary links.
#
# The repo pins wasm-bindgen 0.2.129 in Cargo.lock and build.sh knows the version, so the CI step
# just calls it.
steps:
  - name: check
    image: docker.io/library/rust:1.99.1
    # The namespace LimitRange gives an unmarked step 1 Gi (default 1Gi in
    # clusters/dev/applications/woodpecker/limits.yaml) and this step OOMs inside it: bench-flightsim
    # pipeline 2 died with exit 137 and "received oom kill" partway through `Compiling bevy_reflect`.
    # The server crate uses bevy_ecs too, so even a wasm-only repo pays the full bevy graph here.
    # Two CPUs as well as 8 Gi: rustc sizes its job count from available_parallelism, which reads the
    # cgroup, so the old 1 CPU default was not the ceiling on parallelism that it looked like. 4 Gi,
    # the previous LimitRange max, was still not enough (pipeline 3 OOMed compiling bevy_pbr), so the
    # ceiling moved to 8 Gi and the step asks for it.
    environment:
      # Debuginfo is the dominant memory cost of a Bevy dev build and cargo test uses the dev profile;
      # turning it off is the single biggest lever on peak RSS here and it halves the build time.
      # Backtraces in test failures lose line detail, which is the trade being made.
      CARGO_PROFILE_DEV_DEBUG: "0"
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 8Gi
    commands:
      - cargo --version
      - rustup target add wasm32-unknown-unknown
      # ./build.sh fetches wasm-bindgen 0.2.129 (the version pinned in Cargo.lock) and wasm-opt into tools/
      # itself when they are not on PATH, so the step needs no cache volume and no cargo install.
      # `cargo fmt --check` fails closed on this image: rust:1.99.1 ships without the rustfmt
      # component (measured: `cargo fmt --version` -> "error: 'cargo-fmt' is not installed for the
      # toolchain '1.99.1'"), and unlike the wasm benches there is no rust-toolchain.toml here to
      # pull it in. The 1.97.1 benches do have one, which is why their fmt passes.
      - rustup component add rustfmt
      - cargo fmt --check
      # the client is a wasm target: host-compiling it drags bevy/winit to wayland-client, which the
      # rust image has no headers for (measured: "The file `wayland-client.pc` needs to be installed
      # and the PKG_CONFIG_PATH environment variable must contain its parent directory"). ./build.sh
      # below compiles the client for wasm32 properly, which is the check that means something.
      - cargo test --workspace --exclude benchy-client
      - ./build.sh
      - ls -l web/benchy_client_bg.wasm web/benchy_client.js target/release/benchy-server

when:
  - event: push
    branch: master
  - event: pull_request
