[package]
name = "benchy-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
benchy-common = { path = "../common" }
serde_json = "1"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Window",
    "Location",
    "WebSocket",
    "MessageEvent",
    "EventTarget",
    "console",
] }
bevy = { version = "0.19.1", default-features = false, features = [
    "2d",
    "web",
    "std",
    "async_executor",
    "bevy_color",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
] }
